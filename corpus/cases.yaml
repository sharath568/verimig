# VeriMig pilot corpus: SAP ASE (Sybase) -> Microsoft SQL Server dialect traps.
#
# Field reference
#   id            unique case id
#   category      trap category (see README / paper Table I)
#   observability "compile" = an unconverted construct fails to compile on SQL Server
#                 "silent"  = an unconverted/naive construct compiles but changes behaviour
#                 "deprecation" = compiles and behaves the same, but uses deprecated features
#                 "control" = already portable; measures harmful over-editing
#   source        the Sybase ASE object to translate (what the converter sees)
#   setup         target-side schema/data (SQL Server dialect) created before deploying
#   golden        reference SQL Server translation (the oracle for gate G3)
#   calls         statements executed on both reference and candidate databases
#   ordered       if false, result rows are compared as multisets
#   differential  if false, the case is scored on G1/G2 only (target contract is a policy choice)
#   compare_messages  compare PRINT / informational messages too
#   review        true = ASE semantics must be confirmed by a DBA on a real ASE 16 instance
#                 before results are reported (see README, "Validating the corpus")
#
# IMPORTANT: every golden translation must be reviewed and signed off by the authors
# before any number from this corpus is reported in a paper.

cases:

- id: C01
  category: legacy_outer_join
  observability: compile
  title: Legacy *= outer join
  setup: |
    CREATE TABLE cust (id int PRIMARY KEY, name varchar(30));
    CREATE TABLE ord (id int PRIMARY KEY, cust_id int, amt money);
    INSERT cust VALUES (1,'Ana'),(2,'Bo'),(3,'Cy');
    INSERT ord VALUES (10,1,100),(11,1,50),(12,3,20);
  source: |
    create procedure p_cust_orders
    as
    select c.id, c.name, o.amt
    from cust c, ord o
    where c.id *= o.cust_id
    order by c.id, o.amt
  golden: |
    CREATE PROCEDURE p_cust_orders
    AS
    SELECT c.id, c.name, o.amt
    FROM cust c
    LEFT OUTER JOIN ord o ON c.id = o.cust_id
    ORDER BY c.id, o.amt;
  calls:
  - EXEC p_cust_orders
  - INSERT ord VALUES (13,2,75); EXEC p_cust_orders

- id: C02
  category: legacy_outer_join
  observability: silent
  review: true
  title: Legacy outer join with a restriction on the inner table
  notes: >
    In ASE Transact-SQL outer joins, a restriction on the inner table is applied as part of
    the join, so outer rows are preserved. Moving the predicate into WHERE turns the query
    into an inner join -- it compiles but silently drops rows.
  setup: |
    CREATE TABLE cust (id int PRIMARY KEY, name varchar(30));
    CREATE TABLE ord (id int PRIMARY KEY, cust_id int, amt money);
    INSERT cust VALUES (1,'Ana'),(2,'Bo'),(3,'Cy');
    INSERT ord VALUES (10,1,100),(11,1,50),(12,3,20);
  source: |
    create procedure p_big_orders
    as
    select c.id, c.name, o.amt
    from cust c, ord o
    where c.id *= o.cust_id
      and o.amt > 30
    order by c.id, o.amt
  golden: |
    CREATE PROCEDURE p_big_orders
    AS
    SELECT c.id, c.name, o.amt
    FROM cust c
    LEFT OUTER JOIN ord o ON c.id = o.cust_id AND o.amt > 30
    ORDER BY c.id, o.amt;
  calls:
  - EXEC p_big_orders
  - INSERT ord VALUES (13,2,10),(14,2,40); EXEC p_big_orders
  - 'INSERT ord VALUES (15,2,30); EXEC p_big_orders'

- id: C03
  category: cursor_status
  observability: silent
  title: Cursor loop driven by @@sqlstatus
  notes: >
    @@sqlstatus does not exist in SQL Server. A converter that maps it to @@FETCH_STATUS
    must also map the value domain (ASE 0/1/2 vs SQL Server 0/-1/-2).
  setup: |
    CREATE TABLE item (id int, qty int);
    INSERT item VALUES (1,5),(2,7),(3,0);
  source: |
    create procedure p_sum_qty
    as
    declare @id int, @q int, @tot int
    select @tot = 0
    declare c1 cursor for
      select id, qty from item order by id
      for read only
    open c1
    fetch c1 into @id, @q
    while (@@sqlstatus = 0)
    begin
      select @tot = @tot + @q
      fetch c1 into @id, @q
    end
    close c1
    deallocate cursor c1
    select @tot as total
  golden: |
    CREATE PROCEDURE p_sum_qty
    AS
    BEGIN
      DECLARE @id int, @q int, @tot int;
      SET @tot = 0;
      DECLARE c1 CURSOR LOCAL FAST_FORWARD FOR
        SELECT id, qty FROM item ORDER BY id;
      OPEN c1;
      FETCH NEXT FROM c1 INTO @id, @q;
      WHILE (@@FETCH_STATUS = 0)
      BEGIN
        SET @tot = @tot + @q;
        FETCH NEXT FROM c1 INTO @id, @q;
      END;
      CLOSE c1;
      DEALLOCATE c1;
      SELECT @tot AS total;
    END;
  calls:
  - EXEC p_sum_qty
  - DELETE item; EXEC p_sum_qty

- id: C04
  category: reporting_clause
  observability: compile
  differential: false
  title: COMPUTE BY subtotal report
  notes: >
    COMPUTE BY was removed from SQL Server. The target result shape (GROUPING SETS rows,
    separate queries, or client-side subtotals) is a design decision, so this case is scored
    on G1/G2 only.
  setup: |
    CREATE TABLE sales (region varchar(10), rep varchar(10), amt int);
    INSERT sales VALUES ('E','a',10),('E','b',20),('W','c',5);
  source: |
    create procedure p_sales
    as
    select region, rep, amt
    from sales
    order by region, rep
    compute sum(amt) by region
  golden: |
    CREATE PROCEDURE p_sales
    AS
    SELECT region, rep, SUM(amt) AS amt
    FROM sales
    GROUP BY GROUPING SETS ((region, rep), (region))
    ORDER BY region, GROUPING(rep), rep;
  calls:
  - EXEC p_sales

- id: C05
  category: error_handling
  observability: compile
  title: ASE-style RAISERROR with numeric error and string
  setup: ""
  source: |
    create procedure p_withdraw @bal int, @amt int
    as
    if @amt > @bal
    begin
      raiserror 20001 "Insufficient funds"
      return 1
    end
    select @bal - @amt as new_bal
    return 0
  golden: |
    CREATE PROCEDURE p_withdraw @bal int, @amt int
    AS
    BEGIN
      IF @amt > @bal
      BEGIN
        RAISERROR('Insufficient funds', 16, 1);
        RETURN 1;
      END;
      SELECT @bal - @amt AS new_bal;
      RETURN 0;
    END;
  calls:
  - EXEC p_withdraw 100, 30
  - EXEC p_withdraw 10, 30
  - EXEC p_withdraw 30, 30

- id: C06
  category: quoting
  observability: compile
  review: true
  title: Double-quoted string literals
  notes: >
    With QUOTED_IDENTIFIER ON (the default for modern SQL Server clients), "Hello, " is an
    identifier, not a string, so the object fails at creation or at first execution.
  setup: ""
  source: |
    create procedure p_greet @name varchar(20)
    as
    select "Hello, " + @name as greeting
  golden: |
    CREATE PROCEDURE p_greet @name varchar(20)
    AS
    SELECT 'Hello, ' + ISNULL(@name, '') AS greeting;  -- ASE concatenates NULL as '' (see C09)
  calls:
  - EXEC p_greet 'Prasad'
  - EXEC p_greet NULL

- id: C07
  category: messaging
  observability: compile
  compare_messages: true
  title: PRINT with %n! format arguments
  setup: ""
  source: |
    create procedure p_report @n int
    as
    print "Processed %1! rows", @n
  golden: |
    CREATE PROCEDURE p_report @n int
    AS
    PRINT 'Processed ' + CAST(@n AS varchar(12)) + ' rows';
  calls:
  - EXEC p_report 42
  - EXEC p_report 0

- id: C08
  category: null_semantics
  observability: silent
  title: "= NULL comparison"
  notes: >
    ASE's default Transact-SQL behaviour lets `col = NULL` match NULLs. SQL Server
    procedures created with ANSI_NULLS ON return no rows for the same predicate.
  setup: |
    CREATE TABLE emp (id int, mgr_id int NULL);
    INSERT emp VALUES (1,NULL),(2,1),(3,1),(4,NULL);
  source: |
    create procedure p_top_level
    as
    select id from emp where mgr_id = null order by id
  golden: |
    CREATE PROCEDURE p_top_level
    AS
    SELECT id FROM emp WHERE mgr_id IS NULL ORDER BY id;
  calls:
  - EXEC p_top_level
  - DELETE emp WHERE mgr_id IS NULL; EXEC p_top_level

- id: C09
  category: null_semantics
  observability: silent
  review: true
  title: String concatenation with NULL
  notes: >
    ASE treats NULL as an empty string when concatenated; SQL Server (CONCAT_NULL_YIELDS_NULL
    ON) yields NULL for the whole expression.
  setup: |
    CREATE TABLE person (id int, first varchar(20), middle varchar(20) NULL, last varchar(20));
    INSERT person VALUES (1,'Ann',NULL,'Lee'),(2,'Raj','K','Rao');
  source: |
    create procedure p_fullnames
    as
    select id, first + ' ' + middle + ' ' + last as full_name
    from person
    order by id
  golden: |
    CREATE PROCEDURE p_fullnames
    AS
    SELECT id, first + ' ' + ISNULL(middle, '') + ' ' + last AS full_name
    FROM person
    ORDER BY id;
  calls:
  - EXEC p_fullnames
  - INSERT person VALUES (3,'Mo',NULL,'Ng'); EXEC p_fullnames

- id: C10
  category: grouping
  observability: compile
  review: true
  title: Transact-SQL GROUP BY extension (non-grouped columns in select list)
  notes: >
    ASE returns every qualifying row with its group aggregate attached. SQL Server rejects
    the query; a faithful translation uses a windowed aggregate, while a naive fix that adds
    the column to GROUP BY compiles but changes the result.
  setup: |
    CREATE TABLE title (id int, type varchar(10), price int);
    INSERT title VALUES (1,'biz',10),(2,'biz',30),(3,'cook',7);
  source: |
    create procedure p_type_avg
    as
    select id, type, avg(price) as avg_price
    from title
    group by type
    order by id
  golden: |
    CREATE PROCEDURE p_type_avg
    AS
    SELECT id, type, AVG(price) OVER (PARTITION BY type) AS avg_price
    FROM title
    ORDER BY id;
  calls:
  - EXEC p_type_avg
  - INSERT title VALUES (4,'cook',13); EXEC p_type_avg

- id: C11
  category: locking_hints
  observability: compile
  title: Unbracketed HOLDLOCK table hint
  setup: |
    CREATE TABLE acct (id int PRIMARY KEY, bal int);
    INSERT acct VALUES (1,100),(2,250);
  source: |
    create procedure p_read_bal @id int
    as
    begin tran
    select bal from acct holdlock where id = @id
    commit tran
  golden: |
    CREATE PROCEDURE p_read_bal @id int
    AS
    BEGIN
      BEGIN TRAN;
      SELECT bal FROM acct WITH (HOLDLOCK) WHERE id = @id;
      COMMIT TRAN;
    END;
  calls:
  - EXEC p_read_bal 2
  - EXEC p_read_bal 99

- id: C12
  category: locking_hints
  observability: compile
  title: ASE index hint syntax
  setup: |
    CREATE TABLE prod (id int, sku varchar(10));
    CREATE INDEX ix_sku ON prod(sku);
    INSERT prod VALUES (1,'A1'),(2,'B2'),(3,'A1');
  source: |
    create procedure p_by_sku @sku varchar(10)
    as
    select id from prod (index ix_sku) where sku = @sku order by id
  golden: |
    CREATE PROCEDURE p_by_sku @sku varchar(10)
    AS
    SELECT id FROM prod WITH (INDEX(ix_sku)) WHERE sku = @sku ORDER BY id;
  calls:
  - EXEC p_by_sku 'A1'
  - EXEC p_by_sku 'ZZ'

- id: C13
  category: builtin_functions
  observability: compile
  title: str_replace built-in
  setup: ""
  source: |
    create procedure p_clean @s varchar(50)
    as
    select str_replace(@s, '-', '_') as cleaned
  golden: |
    CREATE PROCEDURE p_clean @s varchar(50)
    AS
    SELECT REPLACE(@s, '-', '_') AS cleaned;
  calls:
  - EXEC p_clean 'AB-12-CD'
  - EXEC p_clean 'no-dash-at-all-'
  - EXEC p_clean NULL

- id: C14
  category: datatypes
  observability: compile
  title: Unsigned integer column
  notes: Values above 2^31-1 must still fit after conversion.
  setup: ""
  source: |
    create table meter (id int, reading unsigned int)
  golden: |
    CREATE TABLE meter (id int, reading bigint CHECK (reading >= 0));
  calls:
  - INSERT meter VALUES (1, 4000000000); SELECT id, reading FROM meter
  - INSERT meter VALUES (2, 0); SELECT id, reading FROM meter ORDER BY id

- id: C15
  category: datatypes
  observability: compile
  title: bigdatetime and univarchar columns
  notes: Mapping bigdatetime to datetime silently loses microseconds.
  setup: ""
  source: |
    create table evt (id int, ts bigdatetime, label univarchar(20))
  golden: |
    CREATE TABLE evt (id int, ts datetime2(6), label nvarchar(20));
  calls:
  - INSERT evt VALUES (1, '2026-01-02 03:04:05.123456', N'caf' + NCHAR(233)); SELECT id, ts, label FROM evt
  - 'INSERT evt VALUES (2, ''2026-12-31 23:59:59.999999'', N''end''); SELECT id, ts, label FROM evt ORDER BY id'
  - 'INSERT evt VALUES (3, ''2026-06-01 00:00:00.000001'', N''x'' + NCHAR(20013)); SELECT id, label FROM evt ORDER BY id'

- id: C16
  category: datatypes
  observability: deprecation
  title: text / image / timestamp columns
  notes: Still accepted by SQL Server but deprecated; G2 should flag them.
  setup: ""
  source: |
    create table doc (id int, body text null, blob image null, ver timestamp)
  golden: |
    CREATE TABLE doc (id int, body varchar(max) NULL, blob varbinary(max) NULL, ver rowversion);
  calls:
  - INSERT doc (id, body, blob) VALUES (1, 'hello', 0x0A0B); SELECT id, body, blob FROM doc
  - UPDATE doc SET body = REPLICATE(CAST('x' AS varchar(max)), 9000) WHERE id = 1; SELECT id, LEN(CAST(body AS varchar(max))) AS len FROM doc

- id: C17
  category: ddl_storage
  observability: compile
  title: Table lock scheme clause
  setup: ""
  source: |
    create table ledger (id int primary key, amt money) lock datarows
  golden: |
    CREATE TABLE ledger (id int PRIMARY KEY, amt money);
  calls:
  - INSERT ledger VALUES (1, 9.99); SELECT id, amt FROM ledger
  - INSERT ledger VALUES (2, 0.0001); SELECT id, amt FROM ledger ORDER BY id

- id: C18
  category: transactions
  observability: compile
  title: "@@tranchained transaction-mode check"
  setup: ""
  source: |
    create procedure p_txn_mode
    as
    if @@tranchained = 0
      select 'unchained' as mode
    else
      select 'chained' as mode
  golden: |
    CREATE PROCEDURE p_txn_mode
    AS
    IF (@@OPTIONS & 2) = 0
      SELECT 'unchained' AS mode;
    ELSE
      SELECT 'chained' AS mode;
  calls:
  - EXEC p_txn_mode
  - SET IMPLICIT_TRANSACTIONS ON; EXEC p_txn_mode; IF @@TRANCOUNT > 0 COMMIT; SET IMPLICIT_TRANSACTIONS OFF

- id: C19
  category: string_semantics
  observability: silent
  differential: false
  review: true
  title: Empty-string assignment
  notes: >
    ASE interprets '' assigned to varchar as a single blank (DATALENGTH = 1); SQL Server
    keeps an empty string (DATALENGTH = 0). Whether to preserve this is a migration policy
    decision, so the case is scored on G1/G2 and discussed qualitatively.
  setup: ""
  source: |
    create procedure p_empty
    as
    declare @s varchar(10)
    select @s = ''
    select datalength(@s) as dl
  golden: |
    CREATE PROCEDURE p_empty
    AS
    DECLARE @s varchar(10);
    SET @s = '';
    SELECT DATALENGTH(@s) AS dl;
  calls:
  - EXEC p_empty

- id: C20
  category: control
  observability: control
  title: Portable UPDATE ... FROM with temp table (control)
  setup: |
    CREATE TABLE price (sku varchar(10), p int);
    CREATE TABLE adj (sku varchar(10), pct int);
    INSERT price VALUES ('A',100),('B',200),('C',300);
    INSERT adj VALUES ('A',10),('B',0),('C',-50);
  source: |
    create procedure p_apply_adj
    as
    select sku, pct into #a from adj where pct <> 0
    update price set p = p + (p * a.pct) / 100
    from price, #a a
    where price.sku = a.sku
    select sku, p from price order by sku
  golden: |
    CREATE PROCEDURE p_apply_adj
    AS
    SELECT sku, pct INTO #a FROM adj WHERE pct <> 0
    UPDATE price SET p = p + (p * a.pct) / 100
    FROM price, #a a
    WHERE price.sku = a.sku
    SELECT sku, p FROM price ORDER BY sku
  calls:
  - EXEC p_apply_adj
  - UPDATE adj SET pct = 0; EXEC p_apply_adj

- id: C21
  category: control
  observability: control
  title: Portable date arithmetic and CONVERT style (control)
  setup: ""
  source: |
    create procedure p_due @d datetime
    as
    select convert(char(10), dateadd(dd, 30, @d), 101) as due,
           datediff(dd, @d, dateadd(mm, 1, @d)) as days
  golden: |
    CREATE PROCEDURE p_due @d datetime
    AS
    SELECT CONVERT(char(10), DATEADD(dd, 30, @d), 101) AS due,
           DATEDIFF(dd, @d, DATEADD(mm, 1, @d)) AS days;
  calls:
  - EXEC p_due '2026-01-31'
  - EXEC p_due '2024-02-29'
  - EXEC p_due '2026-12-15'

# ---------------------------------------------------------------- extended corpus (v2)

- id: C22
  category: cursor_status
  observability: silent
  title: Cursor loop on @@sqlstatus != 2 (value-domain mapping)
  notes: >
    ASE uses 2 for "no more rows"; SQL Server uses -1. Renaming the global without remapping
    the value (WHILE @@FETCH_STATUS != 2) never terminates; the harness statement timeout ends it.
  setup: |
    CREATE TABLE item (id int, qty int);
    INSERT item VALUES (1,5),(2,7),(3,9);
  source: |
    create procedure p_count_items
    as
    declare @id int, @n int
    select @n = 0
    declare c2 cursor for select id from item for read only
    open c2
    fetch c2 into @id
    while (@@sqlstatus != 2)
    begin
      select @n = @n + 1
      fetch c2 into @id
    end
    close c2
    deallocate cursor c2
    select @n as n
  golden: |
    CREATE PROCEDURE p_count_items
    AS
    BEGIN
      DECLARE @id int, @n int;
      SET @n = 0;
      DECLARE c2 CURSOR LOCAL FAST_FORWARD FOR SELECT id FROM item;
      OPEN c2;
      FETCH NEXT FROM c2 INTO @id;
      WHILE (@@FETCH_STATUS = 0)
      BEGIN
        SET @n = @n + 1;
        FETCH NEXT FROM c2 INTO @id;
      END;
      CLOSE c2;
      DEALLOCATE c2;
      SELECT @n AS n;
    END;
  calls:
  - EXEC p_count_items
  - DELETE item; EXEC p_count_items

- id: C23
  category: error_handling
  observability: compile
  title: RAISERROR with %1! argument substitution
  setup: |
    CREATE TABLE acct (id int PRIMARY KEY, bal int);
    INSERT acct VALUES (1,100);
  source: |
    create procedure p_get_acct @id int
    as
    if not exists (select 1 from acct where id = @id)
    begin
      raiserror 20002 "Account %1! not found", @id
      return 1
    end
    select bal from acct where id = @id
  golden: |
    CREATE PROCEDURE p_get_acct @id int
    AS
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM acct WHERE id = @id)
      BEGIN
        RAISERROR('Account %d not found', 16, 1, @id);
        RETURN 1;
      END;
      SELECT bal FROM acct WHERE id = @id;
    END;
  calls:
  - EXEC p_get_acct 1
  - EXEC p_get_acct 7

- id: C24
  category: messaging
  observability: compile
  compare_messages: true
  title: PRINT with two substitution arguments
  setup: ""
  source: |
    create procedure p_totals @a int, @b int
    as
    print "Rows: %1!, total: %2!", @a, @b
  golden: |
    CREATE PROCEDURE p_totals @a int, @b int
    AS
    PRINT 'Rows: ' + CAST(@a AS varchar(12)) + ', total: ' + CAST(@b AS varchar(12));
  calls:
  - EXEC p_totals 3, 120
  - EXEC p_totals 0, -5

- id: C25
  category: null_semantics
  observability: silent
  title: "!= NULL comparison"
  setup: |
    CREATE TABLE emp (id int, mgr_id int NULL);
    INSERT emp VALUES (1,NULL),(2,1),(3,1),(4,NULL);
  source: |
    create procedure p_managed
    as
    select id from emp where mgr_id != null order by id
  golden: |
