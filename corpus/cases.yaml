    AS
    SELECT id FROM emp WHERE mgr_id IS NOT NULL ORDER BY id;
  calls:
  - EXEC p_managed
  - UPDATE emp SET mgr_id = NULL; EXEC p_managed

- id: C26
  category: null_semantics
  observability: silent
  review: true
  title: "= NULL test on a variable in IF"
  setup: ""
  source: |
    create procedure p_has_code @code varchar(5)
    as
    if @code = null
      select 'missing' as status
    else
      select 'present' as status
  golden: |
    CREATE PROCEDURE p_has_code @code varchar(5)
    AS
    IF @code IS NULL
      SELECT 'missing' AS status;
    ELSE
      SELECT 'present' AS status;
  calls:
  - EXEC p_has_code NULL
  - EXEC p_has_code 'X1'

- id: C27
  category: null_semantics
  observability: silent
  review: true
  title: NULL concatenation into a variable
  setup: ""
  source: |
    create procedure p_label @prefix varchar(10), @suffix varchar(10)
    as
    declare @s varchar(30)
    select @s = @prefix + '-' + @suffix
    select @s as label
  golden: |
    CREATE PROCEDURE p_label @prefix varchar(10), @suffix varchar(10)
    AS
    DECLARE @s varchar(30);
    SET @s = ISNULL(@prefix, '') + '-' + ISNULL(@suffix, '');
    SELECT @s AS label;
  calls:
  - EXEC p_label 'INV', '001'
  - EXEC p_label 'INV', NULL
  - EXEC p_label NULL, NULL

- id: C28
  category: grouping
  observability: compile
  review: true
  title: Aggregate with extra columns and no GROUP BY
  notes: ASE returns every row with the whole-table aggregate; reproduce with OVER ().
  setup: |
    CREATE TABLE title (id int, type varchar(10), price int);
    INSERT title VALUES (1,'biz',10),(2,'biz',30),(3,'cook',7);
  source: |
    create procedure p_vs_max
    as
    select id, price, max(price) as top_price
    from title
    order by id
  golden: |
    CREATE PROCEDURE p_vs_max
    AS
    SELECT id, price, MAX(price) OVER () AS top_price
    FROM title
    ORDER BY id;
  calls:
  - EXEC p_vs_max
  - DELETE title; EXEC p_vs_max

- id: C29
  category: legacy_outer_join
  observability: compile
  title: Legacy =* right outer join
  setup: |
    CREATE TABLE cust (id int PRIMARY KEY, name varchar(30));
    CREATE TABLE ord (id int PRIMARY KEY, cust_id int, amt money);
    INSERT cust VALUES (1,'Ana'),(2,'Bo'),(3,'Cy');
    INSERT ord VALUES (10,1,100),(11,1,50),(12,3,20);
  source: |
    create procedure p_orders_all_cust
    as
    select c.id, o.id as ord_id
    from ord o, cust c
    where o.cust_id =* c.id
    order by c.id, o.id
  golden: |
    CREATE PROCEDURE p_orders_all_cust
    AS
    SELECT c.id, o.id AS ord_id
    FROM ord o
    RIGHT OUTER JOIN cust c ON o.cust_id = c.id
    ORDER BY c.id, o.id;
  calls:
  - EXEC p_orders_all_cust
  - DELETE ord; EXEC p_orders_all_cust

- id: C30
  category: legacy_outer_join
  observability: silent
  review: true
  title: Legacy outer join with a restriction on the outer table
  notes: >
    A restriction on the outer (preserved) table filters outer rows, so it belongs in WHERE.
    Placing it in ON keeps every customer and silently changes the result.
  setup: |
    CREATE TABLE cust (id int PRIMARY KEY, name varchar(30));
    CREATE TABLE ord (id int PRIMARY KEY, cust_id int, amt money);
