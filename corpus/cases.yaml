- id: C47
  category: composite
  observability: composite
  split: heldout
  review: true
  title: Regional customer report (outer join, = NULL, RAISERROR)
  setup: |
    CREATE TABLE cust (id int PRIMARY KEY, name varchar(30), region varchar(5) NULL);
    CREATE TABLE ord (id int PRIMARY KEY, cust_id int, amt money);
    INSERT cust VALUES (1,'Ana','E'),(2,'Bo',NULL),(3,'Cy','W'),(4,'Di',NULL);
    INSERT ord VALUES (10,1,100),(11,1,50),(12,3,20);
  source: |
    create procedure p_region_report @region varchar(5)
    as
    if @region != null and not exists (select 1 from cust where region = @region)
    begin
      raiserror 20010 "Unknown region %1!", @region
      return 1
    end
    if @region = null
      select c.id, c.name, sum(o.amt) as total
      from cust c, ord o
      where c.id *= o.cust_id
        and c.region = null
      group by c.id, c.name
      order by c.id
    else
      select c.id, c.name, sum(o.amt) as total
      from cust c, ord o
      where c.id *= o.cust_id
        and c.region = @region
      group by c.id, c.name
      order by c.id
    return 0
  golden: |
    CREATE PROCEDURE p_region_report @region varchar(5)
    AS
    BEGIN
      IF @region IS NOT NULL AND NOT EXISTS (SELECT 1 FROM cust WHERE region = @region)
      BEGIN
        RAISERROR('Unknown region %s', 16, 1, @region);
        RETURN 1;
      END;
      IF @region IS NULL
        SELECT c.id, c.name, SUM(o.amt) AS total
        FROM cust c LEFT OUTER JOIN ord o ON c.id = o.cust_id
        WHERE c.region IS NULL
        GROUP BY c.id, c.name
        ORDER BY c.id;
      ELSE
        SELECT c.id, c.name, SUM(o.amt) AS total
        FROM cust c LEFT OUTER JOIN ord o ON c.id = o.cust_id
        WHERE c.region = @region
        GROUP BY c.id, c.name
        ORDER BY c.id;
      RETURN 0;
    END;
  calls:
  - EXEC p_region_report 'E'
  - EXEC p_region_report NULL
  - EXEC p_region_report 'ZZ'
  - 'INSERT ord VALUES (13,2,10),(14,2,15); EXEC p_region_report NULL'

- id: C48
  category: composite
  observability: composite
  split: heldout
  title: Restock batch (cursor status, str_replace, HOLDLOCK, double quotes)
  setup: |
    CREATE TABLE stock (sku varchar(20), qty int);
    CREATE TABLE stock_log (sku varchar(20), note varchar(60));
    INSERT stock VALUES ('AB-1',5),('CD-2',0),('EF-3',12);
  source: |
    create procedure p_restock @min int
    as
    declare @sku varchar(20), @q int, @clean varchar(20), @cnt int, @total int
    select @cnt = 0
    select @total = sum(qty) from stock holdlock
    declare cs cursor for
      select sku, qty from stock where qty < @min order by sku
      for read only
    open cs
    fetch cs into @sku, @q
    while (@@sqlstatus = 0)
    begin
      select @clean = str_replace(@sku, '-', '_')
      insert stock_log values (@clean, "restock requested")
      select @cnt = @cnt + 1
      fetch cs into @sku, @q
    end
    close cs
    deallocate cursor cs
    select @cnt as restocked, @total as total_qty
    select sku, note from stock_log order by sku
  golden: |
    CREATE PROCEDURE p_restock @min int
    AS
    BEGIN
      DECLARE @sku varchar(20), @q int, @clean varchar(20), @cnt int, @total int;
      SET @cnt = 0;
      SELECT @total = SUM(qty) FROM stock WITH (HOLDLOCK);
      DECLARE cs CURSOR LOCAL FAST_FORWARD FOR
        SELECT sku, qty FROM stock WHERE qty < @min ORDER BY sku;
      OPEN cs;
      FETCH NEXT FROM cs INTO @sku, @q;
      WHILE (@@FETCH_STATUS = 0)
      BEGIN
        SET @clean = REPLACE(@sku, '-', '_');
        INSERT stock_log VALUES (@clean, 'restock requested');
        SET @cnt = @cnt + 1;
        FETCH NEXT FROM cs INTO @sku, @q;
      END;
      CLOSE cs;
      DEALLOCATE cs;
      SELECT @cnt AS restocked, @total AS total_qty;
      SELECT sku, note FROM stock_log ORDER BY sku;
    END;
  calls:
  - EXEC p_restock 6
  - EXEC p_restock 0

- id: C49
  category: composite
  observability: composite
  split: heldout
  title: Funds transfer (= NULL, RAISERROR with arguments, HOLDLOCK, transaction)
  setup: |
    CREATE TABLE acct (id int PRIMARY KEY, bal int NULL);
    INSERT acct VALUES (1,100),(2,50),(3,NULL);
  source: |
    create procedure p_transfer @from int, @to int, @amt int
    as
    declare @bal int
    select @bal = bal from acct holdlock where id = @from
    if @bal = null
    begin
      raiserror 20020 "Account %1! has no balance", @from
      return 2
    end
    if @bal < @amt
    begin
      raiserror 20021 "Insufficient funds in account %1!", @from
      return 1
    end
    begin tran
    update acct set bal = bal - @amt where id = @from
    update acct set bal = bal + @amt where id = @to
    commit tran
    select id, bal from acct order by id
    return 0
  golden: |
    CREATE PROCEDURE p_transfer @from int, @to int, @amt int
    AS
    BEGIN
      DECLARE @bal int;
      SELECT @bal = bal FROM acct WITH (HOLDLOCK) WHERE id = @from;
      IF @bal IS NULL
      BEGIN
        RAISERROR('Account %d has no balance', 16, 1, @from);
        RETURN 2;
      END;
      IF @bal < @amt
      BEGIN
        RAISERROR('Insufficient funds in account %d', 16, 1, @from);
        RETURN 1;
      END;
      BEGIN TRAN;
      UPDATE acct SET bal = bal - @amt WHERE id = @from;
      UPDATE acct SET bal = bal + @amt WHERE id = @to;
      COMMIT TRAN;
      SELECT id, bal FROM acct ORDER BY id;
      RETURN 0;
    END;
  calls:
  - EXEC p_transfer 1, 2, 30
  - EXEC p_transfer 2, 1, 500
  - EXEC p_transfer 3, 1, 10
  - EXEC p_transfer 9, 1, 10
  - 'EXEC p_transfer 2, 1, 80'

